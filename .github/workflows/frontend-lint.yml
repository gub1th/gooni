name: frontend-lint

# Runs ESLint on the frontend. The load-bearing rule is
# react-hooks/rules-of-hooks (error) — it would have caught the #357
# "rendered fewer hooks than expected" crash at PR time instead of in prod.
# Everything else from the recommended sets is currently "warn" (pre-existing
# debt, burns down over time), so this job only goes red on a real hooks
# violation or a new hard error.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-lint.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
