<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/gooni-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Gooni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Global reset — kills the default 8px body margin that was letting the desktop
         show through around the edges when the app is installed as a PWA (or any time
         the viewport background wasn't explicitly set). */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      /* The ground is the ambient VOID, and it has to be right on the FIRST
         paint — not once React has mounted and ThemeVarSync has run. In a
         browser tab a wrong ground is a blink; in the desktop shell it is a
         full-window white flash on every launch of a dark-mode app, and the
         shell's own window backgroundColor makes it a black one for a
         light-mode app. `--gooni-void` is resolved by the boot script below
         and then owned by the theme store as usual. */
      html, body { background: var(--gooni-void, #f7f6f2); }
      body {
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <script>
      // Boot paint. Runs before the bundle, so the ground is correct in the
      // very first frame. It reads the SAME key the theme store persists
      // (`gooni_theme`, JSON-encoded via LocalStorageService — hence the
      // quote-stripping) and the SAME two void colours as AMBIENT_PALETTES in
      // src/stores/useGooniThemeStore.ts. Duplicated on purpose: nothing from
      // the bundle can run this early. Anything unreadable falls through to the
      // store's own default, light.
      (function () {
        try {
          var raw = window.localStorage.getItem("gooni_theme") || "";
          var theme = raw.replace(/^"|"$/g, "").toLowerCase() === "dark" ? "dark" : "light";
          document.documentElement.style.setProperty(
            "--gooni-void",
            theme === "dark" ? "#000000" : "#f7f6f2"
          );
        } catch (e) {
          /* private mode / storage blocked — the CSS fallback is the answer */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
  </body>
</html>
